name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run validate
      - run: npm run package
      - run: npm run validate
      - uses: actions/upload-artifact@v4
        with:
          name: last-comment-extension
          path: dist/last-comment-extension-*.zip
          if-no-files-found: error
          retention-days: 14
